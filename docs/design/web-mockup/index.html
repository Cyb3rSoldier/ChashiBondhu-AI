<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>চাষীবন্ধু | ChashiBondhu</title>
  <meta name="description" content="ChashiBondhu connects Bangladeshi farmers directly with consumers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
  <!-- Tailwind Play CDN: fine for prototype. For production, build with Tailwind CLI. -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-header="overlay" class="font-sans antialiased">
  <div id="site-header"></div>

  <main id="top">
    <!-- HERO -->
    <section class="cb-hero-bg relative flex min-h-[92vh] items-center pt-20 text-white">
      <div class="mx-auto w-full max-w-5xl px-4 py-16 text-center sm:px-6">
        <p class="inline-flex items-center gap-2 rounded-full border border-leaf-400/60 bg-leaf-900/40 px-5 py-2 font-semibold tracking-wide text-leaf-300">
          <span class="h-2 w-2 rounded-full bg-leaf-400"></span><span data-i18n="hero_pill"></span>
        </p>
        <h1 class="mt-7 text-4xl font-bold leading-tight sm:text-6xl lg:text-7xl">
          <span data-i18n="hero_title_a"></span>
          <span class="block text-leaf-400" data-i18n="hero_title_b"></span>
        </h1>
        <p class="mx-auto mt-6 max-w-2xl text-lg text-white/90 sm:text-xl" data-i18n="hero_sub"></p>
        <p class="mx-auto mt-1 max-w-2xl text-lg text-white/90 sm:text-xl" data-i18n="hero_sub2"></p>

        <div class="mt-9 flex flex-col justify-center gap-3 sm:flex-row">
          <a href="#produce" class="inline-flex items-center justify-center gap-2 rounded-xl bg-leaf-500 px-7 py-4 text-lg font-bold shadow-lg hover:bg-leaf-600">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M3 9h18l-2 11H5L3 9zm4-1 3-5 1.7 1-2.4 4H7zm9.7 0-2.4-4L16 3l3 5h-2.3z"/></svg>
            <span data-i18n="cta_shop"></span>
          </a>
          <a href="login.html?role=farmer&mode=register" class="inline-flex items-center justify-center gap-2 rounded-xl border border-white/60 bg-white/5 px-7 py-4 text-lg font-bold backdrop-blur hover:bg-white/15">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21v-8m0 0c0-3-2-6-7-6 0 4 2 6 7 6zm0 0c0-3 2-6 7-6 0 4-2 6-7 6z" stroke-linecap="round"/></svg>
            <span data-i18n="cta_join"></span>
          </a>
        </div>

        <ul class="mx-auto mt-12 grid max-w-3xl gap-3 sm:grid-cols-3">
          <li class="rounded-2xl border border-white/20 bg-black/25 px-4 py-4 backdrop-blur">
            <p class="text-xl font-bold" data-i18n="trust_1_t"></p><p class="text-sm text-white/75" data-i18n="trust_1_s"></p>
          </li>
          <li class="rounded-2xl border border-white/20 bg-black/25 px-4 py-4 backdrop-blur">
            <p class="text-xl font-bold" data-i18n="trust_2_t"></p><p class="text-sm text-white/75" data-i18n="trust_2_s"></p>
          </li>
          <li class="rounded-2xl border border-white/20 bg-black/25 px-4 py-4 backdrop-blur">
            <p class="text-xl font-bold" data-i18n="trust_3_t"></p><p class="text-sm text-white/75" data-i18n="trust_3_s"></p>
          </li>
        </ul>

        <a href="#produce" class="mt-10 inline-flex flex-col items-center text-sm font-semibold text-white/70 hover:text-white">
          <span data-i18n="scroll"></span>
          <svg viewBox="0 0 20 20" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M5.2 7.2a.75.75 0 0 1 1.06 0L10 10.94l3.74-3.74a.75.75 0 1 1 1.06 1.06l-4.27 4.27a.75.75 0 0 1-1.06 0L5.2 8.26a.75.75 0 0 1 0-1.06z"/></svg>
        </a>
      </div>
    </section>

    <!-- FRESH PRODUCE -->
    <section id="produce" class="py-16 sm:py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="text-center">
          <p class="inline-block rounded-full bg-leaf-100 px-4 py-1 text-sm font-bold text-leaf-700 dark:bg-leaf-900 dark:text-leaf-300" data-i18n="produce_pill"></p>
          <h2 class="mt-3 text-3xl font-bold sm:text-4xl" data-i18n="produce_title"></h2>
          <p class="mx-auto mt-2 max-w-2xl text-muted" data-i18n="produce_sub"></p>
        </div>

        <div class="mt-8 grid gap-3 lg:grid-cols-[1.3fr_2fr]">
          <label class="relative block">
            <span class="sr-only" data-i18n="search_produce_ph"></span>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-3.5 h-5 w-5 text-muted" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="produce-search" type="search" class="cb-field !pl-10" data-i18n-ph="search_produce_ph">
          </label>
          <div class="grid grid-cols-2 gap-2 rounded-2xl border border-line bg-surface p-2 sm:grid-cols-[1fr_1fr_1.5fr_auto_auto]">
            <input id="produce-min" inputmode="numeric" class="cb-field" data-i18n-ph="min_ph" data-i18n-aria="min_ph">
            <input id="produce-max" inputmode="numeric" class="cb-field" data-i18n-ph="max_ph" data-i18n-aria="max_ph">
            <select id="produce-district" class="cb-field col-span-2 sm:col-span-1" data-i18n-aria="district_all"></select>
            <button id="produce-apply" type="button" class="rounded-xl bg-leaf-600 px-5 font-bold text-white hover:bg-leaf-700" data-i18n="apply"></button>
            <button id="produce-reset" type="button" class="rounded-xl px-4 font-semibold text-muted hover:text-ink" data-i18n="reset"></button>
          </div>
        </div>

        <div id="produce-chips" class="mt-6 flex flex-wrap justify-center gap-2"></div>
        <p id="demo-notice" class="mx-auto mt-6 max-w-2xl rounded-xl bg-amber-50 px-4 py-2 text-center text-sm text-amber-800 dark:bg-amber-900/30 dark:text-amber-200" data-i18n="demo_notice"></p>
        <p id="produce-count" class="mt-6 text-sm text-muted" aria-live="polite"></p>
        <div id="produce-grid" class="mt-3 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
      </div>
    </section>

    <!-- FARMING TOOLS -->
    <section id="tools" class="bg-soil-50/60 py-16 dark:bg-soil-800/10 sm:py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="text-center">
          <p class="inline-block rounded-full bg-soil-100 px-4 py-1 text-sm font-bold text-soil-700 dark:bg-soil-800/40 dark:text-soil-300" data-i18n="tools_pill"></p>
          <h2 class="mt-3 text-3xl font-bold sm:text-4xl" data-i18n="tools_title"></h2>
          <p class="mx-auto mt-2 max-w-2xl text-muted" data-i18n="tools_sub"></p>
        </div>

        <div class="mt-8 grid gap-3 lg:grid-cols-[1.3fr_2fr]">
          <label class="relative block">
            <span class="sr-only" data-i18n="search_tools_ph"></span>
            <svg viewBox="0 0 24 24" class="pointer-events-none absolute left-3 top-3.5 h-5 w-5 text-muted" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="tools-search" type="search" class="cb-field !pl-10" data-i18n-ph="search_tools_ph">
          </label>
          <div class="grid grid-cols-2 gap-2 rounded-2xl border border-line bg-surface p-2 sm:grid-cols-[1fr_1fr_1.5fr_auto_auto]">
            <input id="tools-min" inputmode="numeric" class="cb-field" data-i18n-ph="min_ph" data-i18n-aria="min_ph">
            <input id="tools-max" inputmode="numeric" class="cb-field" data-i18n-ph="max_ph" data-i18n-aria="max_ph">
            <input id="tools-brand" class="cb-field col-span-2 sm:col-span-1" data-i18n-ph="brand_ph" data-i18n-aria="brand_ph">
            <button id="tools-apply" type="button" class="rounded-xl bg-soil-500 px-5 font-bold text-white hover:bg-soil-600" data-i18n="apply"></button>
            <button id="tools-reset" type="button" class="rounded-xl px-4 font-semibold text-muted hover:text-ink" data-i18n="reset"></button>
          </div>
        </div>

        <div id="tools-chips" class="mt-6 flex flex-wrap justify-center gap-2"></div>
        <p id="tools-count" class="mt-6 text-sm text-muted" aria-live="polite"></p>
        <div id="tools-grid" class="mt-3 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
      </div>
    </section>

    <!-- VENDOR BANNER -->
    <section class="bg-gradient-to-r from-soil-700 to-soil-500 py-14 text-center text-white">
      <div class="mx-auto max-w-3xl px-4">
        <h2 class="text-3xl font-bold" data-i18n="vendor_title"></h2>
        <p class="mx-auto mt-3 max-w-xl text-white/90" data-i18n="vendor_sub"></p>
        <a href="login.html?role=vendor&mode=register" class="mt-7 inline-flex items-center gap-2 rounded-xl bg-white px-6 py-3 font-bold text-soil-700 shadow-lg hover:bg-soil-50">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="currentColor" aria-hidden="true"><path d="M21.7 6.3a5.5 5.5 0 0 1-7.2 6.8L6 21.6a2 2 0 1 1-2.8-2.8l8.5-8.5a5.5 5.5 0 0 1 6.8-7.2l-3.3 3.3.6 2.8 2.8.6 3.1-3.5z"/></svg>
          <span data-i18n="vendor_cta"></span>
        </a>
      </div>
    </section>

    <!-- VIDEOS -->
    <section id="videos" class="bg-amber-50/50 py-16 dark:bg-transparent sm:py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="inline-block rounded-full bg-leaf-100 px-4 py-1 text-sm font-bold text-leaf-700 dark:bg-leaf-900 dark:text-leaf-300" data-i18n="video_pill"></p>
            <h2 class="mt-3 text-3xl font-bold text-leaf-700 dark:text-leaf-300" data-i18n="video_title"></h2>
            <p class="mt-1 text-muted" data-i18n="video_sub"></p>
          </div>
          <a href="#videos" class="inline-flex items-center gap-2 self-start rounded-xl bg-leaf-600 px-5 py-3 font-bold text-white hover:bg-leaf-700 sm:self-auto" data-i18n="video_all"></a>
        </div>
        <div id="video-grid" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
      </div>
    </section>

    <!-- TIPS -->
    <section id="blog" class="py-16 sm:py-20">
      <div class="mx-auto max-w-7xl px-4 sm:px-6">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <p class="inline-block rounded-full bg-leaf-100 px-4 py-1 text-sm font-bold text-leaf-700 dark:bg-leaf-900 dark:text-leaf-300" data-i18n="blog_pill"></p>
            <h2 class="mt-3 text-3xl font-bold sm:text-4xl" data-i18n="blog_title"></h2>
            <p class="mt-1 text-muted" data-i18n="blog_sub"></p>
          </div>
          <a href="#blog" class="inline-flex items-center gap-2 self-start rounded-xl bg-leaf-600 px-5 py-3 font-bold text-white hover:bg-leaf-700 sm:self-auto" data-i18n="blog_all"></a>
        </div>
        <div id="tips-grid" class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-4"></div>
        <p class="mt-6 rounded-xl border border-line bg-surface px-4 py-3 text-center text-muted" data-i18n="blog_tip_office"></p>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/districts.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/home.js"></script>
</body>
</html>
