<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>লগইন | ChashiBondhu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="assets/js/boot.js"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans antialiased">
  <div id="site-header"></div>

  <main class="mx-auto grid min-h-screen max-w-6xl items-center gap-8 px-4 pb-16 pt-28 sm:px-6 lg:grid-cols-2">
    <!-- Left: welcome panel -->
    <section id="side-panel" class="hidden rounded-3xl bg-gradient-to-br from-leaf-700 to-leaf-900 p-10 text-white lg:block">
      <h1 class="font-brand text-4xl font-bold" data-i18n="welcome"></h1>
      <p id="side-text" class="mt-4 text-lg text-white/90"></p>
      <p class="mt-10 text-leaf-300" data-i18n="tagline"></p>
      <a href="index.html" class="mt-10 inline-block font-semibold text-white/80 underline-offset-4 hover:underline" data-i18n="back_home"></a>
    </section>

    <!-- Right: form card -->
    <section class="rounded-3xl border border-line bg-surface p-6 shadow-sm sm:p-8">
      <p class="font-semibold text-muted" data-i18n="choose_role"></p>
      <div id="role-picker" class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-4" role="radiogroup"></div>

      <div id="mode-tabs" class="mt-6 grid grid-cols-2 rounded-xl bg-page p-1" role="tablist"></div>

      <h2 id="form-title" class="mt-6 text-2xl font-bold"></h2>
      <p id="admin-note" class="mt-3 hidden rounded-xl bg-slate-100 px-4 py-3 text-sm text-slate-700 dark:bg-slate-800 dark:text-slate-200" data-i18n="admin_note"></p>

      <form id="auth-form" class="mt-5 grid gap-4" novalidate></form>
      <p id="form-status" class="mt-4 hidden rounded-xl px-4 py-3 text-sm" role="status" aria-live="polite"></p>
      <button id="mode-switch" type="button" class="mt-5 font-semibold text-leaf-700 hover:underline dark:text-leaf-300"></button>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/districts.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
