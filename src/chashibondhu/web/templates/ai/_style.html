<style>
.ai-hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin:18px 0}
.ai-card{border:1px solid var(--cb-line,#d9e2d5);border-radius:16px;padding:20px;background:var(--cb-card,#fff);display:flex;flex-direction:column;gap:10px}
.ai-card h2{margin:0;display:flex;align-items:center;gap:10px;font-size:1.5rem}
.ai-card .ai-ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;color:#fff}
.ai-fos .ai-ic{background:#2e7d32}.ai-dr .ai-ic{background:#0e7a4b}
.ai-card ul{margin:0;padding-left:1.1em;line-height:1.7}.ai-tag{font-style:italic;margin:0;opacity:.85}
.ai-wrap{max-width:860px;margin:0 auto;padding:16px 12px 8px}
.ai-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ai-head h1{margin:0;font-size:1.5rem;display:flex;gap:10px;align-items:center}
.ai-log{display:flex;flex-direction:column;gap:14px;margin:16px 0 120px}
.ai-msg{max-width:92%;padding:12px 14px;border-radius:14px;line-height:1.8;font-size:1.05rem}
.ai-me{align-self:flex-end;background:var(--cb-paddy,#2e7d32);color:#fff;border-bottom-right-radius:4px;white-space:pre-line}
.ai-bot{align-self:flex-start;background:var(--cb-card,#fff);border:1px solid var(--cb-line,#d9e2d5);border-bottom-left-radius:4px}
.ai-bot p{margin:0 0 6px}.ai-bot h4{margin:10px 0 4px;font-size:1rem}.ai-bot ul{margin:0 0 6px;padding-left:1.2em}
.ai-cite{font-size:.75em;vertical-align:super;opacity:.7;margin-left:2px}
.ai-q{border-left:4px solid #f9a825;padding:6px 10px;background:rgba(249,168,37,.1);border-radius:6px;margin:8px 0}
.ai-safe{border-left:4px solid #c62828;padding:6px 10px;background:rgba(198,40,40,.07);border-radius:6px;margin:8px 0;font-weight:600}
.ai-src{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.ai-src > span{font-size:.8rem;border:1px solid var(--cb-line,#d9e2d5);border-radius:999px;padding:2px 8px;opacity:.85}
.ai-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.ai-acts button{min-height:36px}
.ai-dots{display:inline-flex;gap:4px;padding:6px 2px}.ai-dots i{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.35;animation:aiDot 1.2s infinite}
.ai-dots i:nth-child(2){animation-delay:.2s}.ai-dots i:nth-child(3){animation-delay:.4s}
@keyframes aiDot{0%,80%,100%{opacity:.25}40%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.ai-dots i{animation:none;opacity:.6}}
.ai-box{position:sticky;bottom:0;background:var(--cb-bg,#f6f8f4);padding:10px 0 14px;border-top:1px solid var(--cb-line,#d9e2d5)}
.ai-box form{display:flex;gap:8px;align-items:flex-end}.ai-box textarea{flex:1;min-height:52px;max-height:180px;resize:vertical;font-size:1.05rem}
.ai-box button{min-width:48px;min-height:48px}.ai-note{font-size:.85rem;opacity:.8;margin:6px 0 0}
.ai-err{color:#c62828}.ai-listen{outline:3px solid #f9a825}
</style>
<style>
.ai-dr .ai-ic,.ai-ic-dr{background:#0e7a4b}
.ai-thumb{max-width:160px;max-height:160px;border-radius:10px;display:block;margin-bottom:6px;object-fit:cover}
.ai-card-data{border:1px solid var(--cb-line,#d9e2d5);border-radius:12px;padding:10px 12px;margin:0 0 10px;background:rgba(21,101,192,.04)}
.ai-card-data p{margin:0 0 6px}.ai-big{font-size:1.6rem;font-weight:700}.ai-big span{font-size:.95rem;font-weight:400}
.ai-w{width:100%;border-collapse:collapse;font-size:.95rem}.ai-w th,.ai-w td{padding:4px 6px;text-align:left;border-top:1px solid var(--cb-line,#e3e8df)}
.ai-tiny{font-size:11px;opacity:.55;text-align:right;margin:4px 0 0}
.ai-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 0}.ai-tools select{max-width:220px;min-height:40px}
[data-ai-preview]{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px}
</style>
